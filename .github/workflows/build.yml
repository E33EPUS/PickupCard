name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 结构自洽性先跑：矩阵矛盾、身份重复、层谓词不符，这些比编译失败更值得早发现。
  # 它不需要 JDK，也就不会把网络/工具链问题混进来。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify target matrix and layers
        run: python tools/verify_targets.py

  # 目标矩阵由 versions/targets.json 决定：工程目录存在就编它。
  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [1.20.1-forge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.target }}
        working-directory: platforms/${{ matrix.target }}
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pickupcard-${{ matrix.target }}
          path: platforms/${{ matrix.target }}/build/libs/*.jar
          if-no-files-found: error
