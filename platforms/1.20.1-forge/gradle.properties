# 平台专属：只有这个目标用的硬约束（版本、Gradle、映射）。
# 仓库级身份（mod_id / mod_name / mod_version / …）在仓库根的 gradle.properties 里，
# 这里一个都不许重复定义 —— 否则各平台就会各自漂移。

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)

# 运行时是 SRG 名，refmap 由 ForgeGradle 生成（见 build.gradle 的 copyRefmap / verifyRefmap）
mapping_channel=official
mapping_version=1.20.1

forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
