// 0.1.0 复原工程（最小 ForgeGradle 配置）
//
// 【为什么单开一个工程，而不是塞进 platforms/1.20.1-forge】
// 那个工程是 reboot 分支的 NanoVG 版：它挂 layers/ + shared/ 两个源集、shade 了 LWJGL
// 原生、跑一套 tokens→JSON 的参数管线。0.1.0 是**另一条线**（烘好的卡面贴图 + 自己的
// configui/anim/layout）。混在一个工程里，两边会互相污染构建（源集、依赖、run 目录都
// 不一样）。分开之后：这个工程只认 recovered 出来的那 44 个文件，编译通了就说明源码真活了。
plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.mod_version
group = project.mod_group_id
base { archivesName = "${project.mod_id}-Legacy-${project.minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods { pickupcard { source sourceSets.main } }
            // 它自带的截图钩子（client/DevShot.java）：入场时间线 / 退场时间线 / 配置界面四页
            // 用 -Pdevshot=true -Pconfigshot=true -Pfadeshot=true 打开，产物在 run/screenshots/
            property 'pickupcard.devshot', (findProperty('devshot') ?: 'false')
            property 'pickupcard.configshot', (findProperty('configshot') ?: 'false')
            property 'pickupcard.fadeshot', (findProperty('fadeshot') ?: 'false')
        }
        server {
            workingDirectory project.file('run-server')
            mods { pickupcard { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
    maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 反编译回来的源码不是"开发环境里写出来的"：官方名与 SRG 名混用、泛型被擦、
// 有些局部变量类型要显式标注。所以先只要求它**编译过**，告警不拦。
tasks.named('compileJava') {
    options.compilerArgs << '-nowarn' << '-Xlint:none'
}
