# 仓库级身份：所有目标共用一份，各平台不许自己定义。
#
# 【为什么只有一处】一次发版所有目标出的是同一个版本号的 jar —— 玩家在不同加载器上
# 装到的 vX.Y.Z 必须是同一次改动。留在各平台里，它们就能各自漂移，而"某个目标悄悄
# 落后"正是这套结构要治的病。
#
# 【读不到就失败，不给默认值】各平台由 gradle/pickupcard-layers.gradle 读本文件，
# 缺键直接抛 GradleException。悄悄退回一个默认值等于把那个病放回来，而且是静默的：
# jar 照样出得来，只是版本号对不上。

mod_id=pickupcard
mod_name=Pickup Card
mod_license=MIT
mod_group_id=com.niuqu.pickupcard
mod_authors=E33EPUS
mod_description=Every item you pick up is dealt into your HUD as a card. Rendered with ApricityUI, so the looks and the animation are authored in CSS.
mod_version=0.1.0

# 渲染引擎。AUI 是玩家侧的硬前置：我们把界面画成 HTML/CSS，这份依赖在运行期必须存在。
apricityui_version=1.2.4-hotfix

# 发布目标（同样的值对所有目标成立）
curseforge_project_id=UNSET
modrinth_project_id=UNSET
