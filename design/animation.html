<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>PickupCard · 入场动画草稿（火车出隧道 · 右下角锚定）</title>
<!-- tokens.css 必须在 theme.css 之前：前者是唯一参数真源，后者只用不定义 -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="theme.css">
<style>
/* 草稿页面自身，不进 token 转换 */
body { margin:0; padding:24px 28px 48px; background:#101014; color:#BFC6D4;
       font:13px/1.6 "Segoe UI", system-ui, sans-serif; }
h1 { font-size:17px; margin:0 0 4px; color:#EBEFF6; }
p.hint { margin:0 0 14px; color:#6E7686; font-size:12px; max-width:820px; }
.controls { display:flex; gap:18px; align-items:center; flex-wrap:wrap;
            margin:0 0 16px; font-size:12px; }
.controls label { color:#8E96A6; cursor:pointer; }
.controls .sep { width:1px; align-self:stretch; background:#FFFFFF1A; }
button { background:#262B38; color:#BFC6D4; border:1px solid #FFFFFF1F;
         border-radius:4px; padding:4px 10px; font:inherit; cursor:pointer; }
button:hover { border-color:#55EBFF66; color:#EBEFF6; }
input[type=range] { width:160px; vertical-align:middle; }

/* 原版 HUD 占位：快捷栏 182x22 贴底居中，血量/护甲在它上面那条带（H-49 起）。
   不是装饰 —— 卡片贴得太低会盖住血量，这条带就是那把尺子。 */
.vanilla-hud { position:absolute; left:calc(50% - 91px); bottom:0; width:182px; height:52px;
               border:1px dashed #FFFFFF26; border-radius:2px; pointer-events:none; }
.vanilla-hud::after { content:"原版 HUD（快捷栏/血量）"; position:absolute; left:0; bottom:2px;
               font-size:8px; color:#FFFFFF3D; white-space:nowrap; }

/* MC 逻辑分辨率 427x240，放大 2 倍显示 */
.frame { width:854px; height:480px; position:relative; }
.frame .stage { width:427px; height:240px; transform:scale(2); transform-origin:top left;
                border-radius:6px; outline:1px solid #FFFFFF1F; }

/* 时长与曲线的草稿侧真源。名字故意不带 --pc-：--pc-* 只属于 tokens.css，
   那是抽取器唯一的入口（清单外的名字会让它在 tokens.css 里失败退出，见 README）。
   这三个数乘出来就是 --pc-enter-ms = 560：竖条 180，内容延迟 100 起跑、460 滑完。 */
:root {
  /* 换位（旧的被新的顶上去）—— Java 的 CardMove 用的就是这条 */
  --draft-ease:    cubic-bezier(.22,.9,.28,1);
  /* 竖条展开 = Java 的 CubicBezier.BAR */
  --draft-ease-bar: cubic-bezier(.2,.9,.3,1);
  /* 内容滑出 = Java 的 CubicBezier.CONTENT（2026-09-17 换的：原来那条前段太陡，
     用户真机上"冲得太快"。两边**必须同时换**，否则拿草稿对游戏会量出假差异） */
  --draft-ease-content: cubic-bezier(.4,0,.2,1);

  /* 时长全部由 --pc-enter-ms（480ms）乘出来，跟 Java 的 CardTimeline 同一个比例：
     竖条占前 50% = 240ms；内容从 20%（96ms）起跑、84%（403ms）走完，末尾 77ms 静止。 */
  --draft-t-bar:   .24s;
  --draft-t-out:   .31s;
  --draft-t-delay: .10s;
  --draft-t-move:  .34s;
  /* 退场淡出 = 配置里的 exitMs（默认 480）。两边**只有这一个数**：草稿原来写 280、后来
     写 320，都成了"同一个动作两个数"，改了这边忘了那边没有东西拦得住。 */
  --draft-t-fade:  .48s;
  /* = Easing.easeOutCubic（Java 侧退场淡出用的就是它；Easing 里注着"透明度的默认选择"） */
  --draft-ease-fade: cubic-bezier(.215,.61,.355,1);
}

/* 一张卡在屏上的位置由 transform 驱动。
   【右下角锚定】第 0 张（最新）永远落在同一条底线上，旧的被往上顶，最老的在堆顶淡出 ——
   入场口固定，眼睛不用满屏找"新卡在哪"；而"往上顶"正好把最老的推出安全区。 */
.slot { position:absolute; left:0; top:0; transition: transform var(--draft-t-move) var(--draft-ease); }
/* 只有正在动的卡才占合成层。5 张静止的卡不该一直挂着 will-change。 */
.slot.animating { will-change: transform, opacity; }
.slot.leaving { opacity:0; pointer-events:none;
                transition: transform var(--draft-t-move) var(--draft-ease),
                            opacity var(--draft-t-fade) var(--draft-ease-fade); }

/* ===== 竖条自己也要有动画 ===== 隧道口先开，火车再出（两段式，内容延迟起跑） */
.bar { transform-origin: top; }   /* 从上头往下长（原来是 center = 往两头长） */
:root[data-bar="grow"]   .bar { transform: scaleY(0); }
:root[data-bar="grow"]   .bar.out { transform: scaleY(1);
        transition: transform var(--draft-t-bar) var(--draft-ease-bar); }
:root[data-bar="fade"]   .bar { opacity: 0; }
:root[data-bar="fade"]   .bar.out { opacity: 1; transition: opacity var(--draft-t-bar) ease-out; }
:root[data-bar="sweep"]  .bar { transform: scaleY(0); }
/* sweep 档：竖条自己从右往左"铺"出来，更像隧道口被推开 */
:root[data-bar="sweep"]  .bar { transform-origin: right center; }
:root[data-bar="sweep"]  .bar.out { transform: scaleY(1);
        transition: transform calc(var(--draft-t-bar) + 40ms) var(--draft-ease-bar); }
:root[data-bar="none"]   .bar { transform: none; opacity: 1; }

/* ===== 隧道口 ===== 竖条右侧的裁剪窗。尺寸由 JS 定死，动画期间不变形。 */
.tunnel { overflow:hidden; display:flex; }
.tunnel > .body { flex: none; }

/* 模式一「火车」：窗口固定，卡整体从竖条后面平移到最终位置（内容尺寸全程不变） */
:root[data-exit="train"] .body { transform: translateX(-100%); }
:root[data-exit="train"] .body.out { transform: translateX(0);
        transition: transform var(--draft-t-out) var(--draft-ease-content); }

/* 模式二「拉幕」：卡不动，窗口宽度从 0 展开，把它一点点露出来 */
:root[data-exit="wipe"] .tunnel { width:0 !important;
        transition: width var(--draft-t-out) var(--draft-ease-content); }
:root[data-exit="wipe"] .tunnel.out { width: var(--w) !important; }

/* ===== 内容延迟起跑 ===== 必须写在所有 transition 简写之后：
   简写会重置 transition-delay，写在前面等于没写（这个坑踩过一次）。
   【选择器要是同一个元素上的两个属性】` :root[a] :root[b] ` 是"后代"，
   而 :root 没有后代，所以拉幕那一档的延迟从来没生效过。 */
:root[data-bar="grow"] .body.out, :root[data-bar="sweep"] .body.out,
:root[data-bar="fade"] .body.out { transition-delay: var(--draft-t-delay); }
:root[data-bar="grow"][data-exit="wipe"]  .tunnel.out,
:root[data-bar="sweep"][data-exit="wipe"] .tunnel.out,
:root[data-bar="fade"][data-exit="wipe"]  .tunnel.out { transition-delay: var(--draft-t-delay); }

/* 晕动症：位移与展开直接给最终态，只留最短的一跳 */
@media (prefers-reduced-motion: reduce) {
  .slot, .slot.leaving, .bar, .body, .tunnel {
    transition-duration: 1ms !important; transition-delay: 0ms !important;
  }
}
</style>
</head>
<body>

<h1>PickupCard · 入场动画（竖条是隧道口，卡片是火车）</h1>
<p class="hint">
  锚在<b>右下角</b>：最新的一张永远从同一条底线冒出来，旧的被往上顶，最老的在堆顶淡出。
  竖条<b>原地出现</b>，其余部分从它右侧<b>滑出来</b>；卡片自身尺寸全程不变 ——
  是位移，不是拉伸。
</p>

<div class="controls">
  <button id="btn-play">暂停</button>
  <button id="btn-spawn">手动来一张</button>
  <button id="btn-clear">清空</button>
  <button id="btn-theme">切浅色</button>
  <div class="sep"></div>
  <span>出隧道方式</span>
  <label><input type="radio" name="exit" value="train" checked> 火车（数字端先出）</label>
  <label><input type="radio" name="exit" value="wipe"> 拉幕（图标端先出）</label>
  <div class="sep"></div>
  <span>竖条动画</span>
  <label><input type="radio" name="bar" value="grow" checked> 纵向展开</label>
  <label><input type="radio" name="bar" value="sweep"> 从右铺开</label>
  <label><input type="radio" name="bar" value="fade"> 淡入</label>
  <label><input type="radio" name="bar" value="none"> 无</label>
  <div class="sep"></div>
  <label>竖条锚点 X <input type="range" id="anchor" min="0" max="380" value="219"><span id="anchor-v">219</span></label>
  <label><input type="checkbox" id="rightalign"> 右边缘对齐</label>
</div>

<div class="frame">
  <div class="stage" id="stage">
    <!-- 原版 HUD 那条带（占位）：卡堆的底边留白就是躲它。画出来才看得见"躲开了没有" -->
    <div class="vanilla-hud"></div>
  </div>
</div>

<script>
const FIXTURES = [
  { n:'石头',       i:'stone.png',           c:'common',   q:'+64'    },
  { n:'鞘翅',       i:'elytra.png',          c:'uncommon', q:'+1'     },
  { n:'信标',       i:'beacon.png',          c:'rare',     q:'+1'     },
  { n:'龙蛋',       i:'dragon_egg.png',      c:'epic',     q:'+1'     },
  { n:'经验',       i:'nether_star.png',     c:'xp',       q:'+137'   },
  { n:'下界合金锭', i:'netherite_ingot.png', c:'rare',     q:'+99999' },
];

const STAGE_W = 427;   // 与 .frame .stage 一致：MC 的逻辑分辨率
const STAGE_H = 240;
const MARGIN  = 16;    // 距屏幕左右 / 下边的留白 —— 下边这个数不是审美的，是躲开原版 HUD
const HUD_SAFE = 52;   // 底边留白：MC 的快捷栏 + 血量/饥饿/护甲那条带占到 H-49
const PITCH   = 26;    // 卡高 22 + 间隙 4（逻辑 px）
const MAX     = 5;

const stage  = document.getElementById('stage');
let slots    = [];     // [0] = 最新，贴着右下角
let retiring = [];     // 正在淡出的那张：已经不在 slots 里，但还在屏上
let next = 0;
let playing = true;
let timer = null;

function cardHtml(f) {
  return `<div class="card" style="--accent: var(--pc-accent-${f.c})">
    <div class="bar"></div>
    <div class="tunnel">
      <div class="body">
        <div class="box icon"><img src="icons/${f.i}" alt=""></div>
        <div class="box info"><span class="name">${f.n}</span><span class="count">${f.q}</span></div>
      </div>
    </div>
  </div>`;
}

/**
 * 一张卡的最终宽度 / 高度。
 * 【宽度为什么不能读 card.offsetWidth】拉幕档下面板的宽从 0 起跑，量到的是"还没展开"的
 * 宽度，右对齐于是把它算到屏幕外面去。竖条宽 + 间隙 + 内容自然宽与动画状态无关，稳。
 * 【高度为什么要读】卡高是从 tokens 来的（图标 16 + 上下内边距各 3），写死 22 就是第二真源。
 */
function px(el) {
  // 【为什么要绕一圈】offsetWidth 是四舍五入过的整数，右对齐会因此多伸出小半个像素（卡片
  // 真的会越界一点点）。getBoundingClientRect 给的是亚像素，但它包着 .stage 的 scale(2)，
  // 得除回去 —— 缩放比从两个已知数算出来，不写死 2。
  const r = stage.getBoundingClientRect();
  return el.getBoundingClientRect().width / (r.width / stage.offsetWidth);
}

function metricsOf(slot) {
  const card = slot.firstElementChild;
  const bar  = card.firstElementChild;
  const body = card.querySelector('.body');
  const gap  = parseFloat(getComputedStyle(card).columnGap) || 0;
  return { slot, card, bar, body,
           w: px(bar) + gap + px(body),
           h: card.offsetHeight };
}

/** 横坐标只有一条公式，两种对齐共用（跟游戏侧 StackLayout 是同一条）。 */
function placeX(w) {
  const rightMode = document.getElementById('rightalign').checked;
  return rightMode ? STAGE_W - MARGIN - w : +document.getElementById('anchor').value;
}

function layout() {
  if (!slots.length) return;
  // ① 先全量读，再统一写。读一次写一次会让浏览器每张卡都强制重排一次（5 张 = 5 次），
  //    而这里读的宽度跟要写的 transform 无关 —— 没有理由交错。
  const all    = slots.map(metricsOf);
  const cardH  = all[0].h;
  const bottom = STAGE_H - HUD_SAFE;

  // ② i = 0 是最新的那张，永远贴着底线；旧的依次往上顶
  for (let i = 0; i < all.length; i++) {
    const y = bottom - cardH - i * PITCH;
    all[i].slot.style.transform = `translate(${placeX(all[i].w)}px, ${y}px)`;
  }
  // 退役的那张再往上站一排，边升边淡出
  const top = bottom - cardH - all.length * PITCH;
  retiring.forEach(r => { r.slot.style.transform = `translate(${r.x}px, ${top}px)`; });
}

/** 挤出去的那张：不立刻删，让它走完最后一跳再消失。 */
function retire(slot) {
  const entry = { slot, x: placeX(metricsOf(slot).w), timer: null };
  retiring.push(entry);
  slot.classList.add('leaving');
  entry.timer = setTimeout(() => {
    slot.remove();
    retiring = retiring.filter(r => r !== entry);
  }, 500);
}

function spawn() {
  const f = FIXTURES[next++ % FIXTURES.length];
  const slot = document.createElement('div');
  slot.className = 'slot animating';
  slot.innerHTML = cardHtml(f);
  stage.appendChild(slot);

  const m      = metricsOf(slot);          // 此刻它已是 DOM 里的一块，量到的是自然尺寸
  const tunnel = slot.querySelector('.tunnel');
  // 拉幕档的窗宽最终要停在这上面：也得是亚像素，否则卡会比该在的位置窄半像素
  tunnel.style.setProperty('--w', px(m.body) + 'px');

  // 【竖条必须原地出现】新槽位要直接落在最终位置，不能复用车位过渡，
  // 否则整张卡会从左边滑进来，看起来像"卡片在移动"而不是"从隧道口长出来"。
  slot.style.transition = 'none';
  slots.unshift(slot);                     // 新的贴到底线，旧的被往上顶
  if (slots.length > MAX) retire(slots.pop());
  layout();                                // 里面读了 offsetWidth = 强制一次重排
  // 【这一行不是多余的】新位置必须**在 transition:none 还生效时**就落定，否则下一帧
  // 浏览器看到的是"transition 已恢复 + transform 刚变了"→ 把新卡从 (0,0) 一路滑过去。
  // layout() 里的读发生在**写之前**（先量后写），所以它挡不住这一下，得在这里再补一次。
  void slot.offsetWidth;
  slot.style.transition = '';              // 之后被别的卡往上顶时，才走过渡

  // 【为什么只等一帧】起始态已经由上面那次强制重排落实了，再等第二帧只是白白晚 16ms
  // 起跑。一帧让浏览器先把这个新元素认下来，然后开动画。
  requestAnimationFrame(() => {
    m.bar.classList.add('out');            // 隧道口先开
    m.body.classList.add('out');           // 火车再出
    tunnel.classList.add('out');
  });
  setTimeout(() => slot.classList.remove('animating'), 700);
}

function clear() {
  slots.forEach(s => s.remove());
  slots = [];
  retiring.forEach(r => { clearTimeout(r.timer); r.slot.remove(); });
  retiring = [];
}

function tick() {
  clearTimeout(timer);
  if (!playing) return;
  timer = setTimeout(() => { spawn(); tick(); }, 1250);
}

document.getElementById('btn-play').onclick = e => {
  playing = !playing;
  e.target.textContent = playing ? '暂停' : '播放';
  tick();
};
document.getElementById('btn-spawn').onclick = spawn;
document.getElementById('btn-clear').onclick = clear;
document.getElementById('btn-theme').onclick = e => {
  const light = document.documentElement.dataset.theme === 'light';
  document.documentElement.dataset.theme = light ? 'dark' : 'light';
  e.target.textContent = light ? '切浅色' : '切深色';
};
document.getElementById('anchor').oninput = e => {
  document.getElementById('anchor-v').textContent = e.target.value;
  layout();
};
document.getElementById('rightalign').onchange = layout;
document.querySelectorAll('input[name=exit]').forEach(r =>
  r.onchange = () => { document.documentElement.dataset.exit = r.value; });

document.documentElement.dataset.exit = 'train';
document.documentElement.dataset.bar = 'grow';
document.querySelectorAll('input[name=bar]').forEach(r =>
  r.onchange = () => { document.documentElement.dataset.bar = r.value; });
spawn(); tick();
setTimeout(spawn, 400);
setTimeout(spawn, 900);
</script>
</body>
</html>
