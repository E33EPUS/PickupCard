<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>PickupCard · 三段式卡面草稿</title>
<!-- tokens.css 必须在 theme.css 之前：前者是唯一参数真源，后者只用不定义 -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="theme.css">
<style>
/* ---- 草稿页面自身，不进 token 转换 ---- */
body { margin:0; padding:24px 28px 60px; background:#101014; color:#BFC6D4;
       font:13px/1.6 "Segoe UI", system-ui, sans-serif; }
:root[data-theme="light"] body { background:#F2F4F8; color:#3A4150; }
h1 { font-size:17px; margin:0 0 4px; color:inherit; }
h2 { font-size:12px; margin:28px 0 10px; color:#7D8695; font-weight:600;
     text-transform:uppercase; letter-spacing:.08em; }
p.hint { margin:0 0 14px; color:#6E7686; font-size:12px; max-width:820px; }
.controls { display:flex; gap:16px; align-items:center; flex-wrap:wrap;
            margin:0 0 18px; font-size:12px;
            padding:10px 14px; border:1px solid #FFFFFF14; border-radius:6px; }
:root[data-theme="light"] .controls { border-color:#00000014; }
.controls label { color:#8E96A6; cursor:pointer; }
.controls .sep { width:1px; align-self:stretch; background:#FFFFFF1A; }
:root[data-theme="light"] .controls .sep { background:#0000001A; }
button { background:#262B38; color:#BFC6D4; border:1px solid #FFFFFF1F;
         border-radius:4px; padding:3px 10px; font:inherit; cursor:pointer; }
button:hover { border-color:#55EBFF66; color:#EBEFF6; }
input[type=range] { width:110px; vertical-align:middle; }
.board { display:inline-block; padding:16px 20px; border-radius:8px; }
.rows { display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
/* 左缘对齐 = 定案的默认版式（卡左缘固定，右缘随名字长短伸缩）。
   一摞卡排下来竖条成一条竖线。这一格跟着 LayoutSettings 的默认值走，
   改那边就要改这里 —— 两边不一致的话，对照表的"固定的是哪条边"会立刻红。 */
.zoom2 { zoom:2; }
</style>
</head>
<body>

<h1>PickupCard · 三段式卡面草稿</h1>
<p class="hint">
  结构：<b>稀有度竖条 ｜ 物品图标格 ｜ 名字 + 数量框</b>，三个独立圆角矩形等高。
  下面这排开关就是将来配置界面要暴露的东西 —— 每个键都必须能独立生效。
</p>

<div class="controls">
  <button id="btn-theme">切浅色</button>
  <div class="sep"></div>
  <span>阴影</span>
  <label><input type="radio" name="sh" value="on" checked> 有</label>
  <label><input type="radio" name="sh" value="none"> 无</label>
  <label>偏移 <input type="range" id="sdy" min="0" max="8" value="3"><span id="sdy-v">3</span></label>
  <label>模糊 <input type="range" id="sblur" min="0" max="16" value="6"><span id="sblur-v">6</span></label>
  <label>浓度 <input type="range" id="sstr" min="0" max="255" step="1" value="90"><span id="sstr-v">90</span></label>
  <div class="sep"></div>
  <span>顶部高光</span>
  <label><input type="radio" name="hl" value="on" checked> 有</label>
  <label><input type="radio" name="hl" value="none"> 无</label>
</div>

<h2>五档强调色（竖条 + 数量同色）</h2>
<div class="board stage"><div class="rows">
  <div class="card" style="--accent: var(--pc-accent-common)">
    <div class="bar"></div>
    <div class="body"><div class="box icon"><img src="icons/stone.png" alt=""></div>
    <div class="box info"><span class="name">石头</span><span class="count">+64</span></div></div>
  </div>
  <div class="card" style="--accent: var(--pc-accent-uncommon)">
    <div class="bar"></div>
    <div class="body"><div class="box icon"><img src="icons/elytra.png" alt=""></div>
    <div class="box info"><span class="name">鞘翅</span><span class="count">+1</span></div></div>
  </div>
  <div class="card" style="--accent: var(--pc-accent-rare)">
    <div class="bar"></div>
    <div class="body"><div class="box icon"><img src="icons/beacon.png" alt=""></div>
    <div class="box info"><span class="name">信标</span><span class="count">+1</span></div></div>
  </div>
  <div class="card" style="--accent: var(--pc-accent-epic)">
    <div class="bar"></div>
    <div class="body"><div class="box icon"><img src="icons/dragon_egg.png" alt=""></div>
    <div class="box info"><span class="name">龙蛋</span><span class="count">+1</span></div></div>
  </div>
  <div class="card" style="--accent: var(--pc-accent-xp)">
    <div class="bar"></div>
    <div class="body"><div class="box icon"><img src="icons/nether_star.png" alt=""></div>
    <div class="box info"><span class="name">经验</span><span class="count">+137</span></div></div>
  </div>
</div></div>

<h2>2× 放大（看圆角 / 描边 / 高光）</h2>
<div class="board stage"><div class="rows zoom2">
  <div class="card" style="--accent: var(--pc-accent-epic)">
    <div class="bar"></div>
    <div class="body"><div class="box icon"><img src="icons/diamond_sword.png" alt=""></div>
    <div class="box info"><span class="name">附魔钻石剑</span><span class="count">+1</span></div></div>
  </div>
  <div class="card" style="--accent: var(--pc-accent-xp)">
    <div class="bar"></div>
    <div class="body"><div class="box icon"><img src="icons/emerald.png" alt=""></div>
    <div class="box info"><span class="name">经验</span><span class="count">+137</span></div></div>
  </div>
</div></div>

<h2>内容边界（卡宽跟名字走）</h2>
<div class="board stage"><div class="rows">
  <div class="card" style="--accent: var(--pc-accent-common)">
    <div class="bar"></div>
    <div class="body"><div class="box icon"><img src="icons/diamond_sword.png" alt=""></div>
    <div class="box info"><span class="name">被铁砧改了名字的附魔钻石剑（超长名字边界）</span><span class="count">+1</span></div></div>
  </div>
  <div class="card" style="--accent: var(--pc-accent-rare)">
    <div class="bar"></div>
    <div class="body"><div class="box icon"><img src="icons/netherite_ingot.png" alt=""></div>
    <div class="box info"><span class="name">下界合金锭</span><span class="count">+99999</span></div></div>
  </div>
  <div class="card" style="--accent: var(--pc-accent-uncommon)">
    <div class="bar"></div>
    <div class="body"><div class="box icon"><img src="icons/golden_apple.png" alt=""></div>
    <div class="box info"><span class="name">石</span><span class="count">+1</span></div></div>
  </div>
</div></div>

<script>
const root = document.documentElement;
document.getElementById('btn-theme').onclick = e => {
  const light = root.dataset.theme === 'light';
  root.dataset.theme = light ? 'dark' : 'light';
  e.target.textContent = light ? '切浅色' : '切深色';
};
document.querySelectorAll('input[name=sh]').forEach(r =>
  r.onchange = () => root.dataset.shadow = r.value === 'on' ? '' : 'none');
document.querySelectorAll('input[name=hl]').forEach(r =>
  r.onchange = () => root.dataset.highlight = r.value === 'on' ? '' : 'none');
const bind = (id, cssVar) => {
  const el = document.getElementById(id), out = document.getElementById(id + '-v');
  el.oninput = () => { root.style.setProperty(cssVar, el.value + 'px'); out.textContent = el.value; };
};
bind('sdy', '--pc-shadow-dy'); bind('sblur', '--pc-shadow-blur');
document.getElementById('sstr').oninput = e => {
  // 浓度只有一份真源：--pc-shadow-alpha（0-255），Java 读的是同一个键
  root.style.setProperty('--pc-shadow-alpha', e.target.value);
  document.getElementById('sstr-v').textContent = e.target.value;
};
</script>
</body>
</html>
